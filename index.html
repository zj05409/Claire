  <main>
    <section id="home" class="hero">
      <div class="hero-copy">
        <p class="kicker">WELCOME TO MY UNIVERSE</p>
        <h1>你好，我是 <span>Claire</span></h1>
        <p>我喜欢阅读、思考、写作、画画和编程。这里收藏着我探索世界时留下的作品、故事与发现。</p>

          <a class="button primary" href="#projects">看看我的作品</a>
          <a class="button ghost" href="doit/">打开立刻行动器</a>

      </div>

        <div class="planet">C</div>
        <span class="star s1">✦</span><span class="star s2">✦</span><span class="star s3">✧</span>
      </div>
    </section>

    <section id="about" class="about section">
      <div>
        <p class="kicker">ABOUT ME</p>
        <h2>一个正在长大的探索者</h2>

    </section>

    <section class="stats section">
      <div><strong id="work-count">0</strong><span>件创作</span></div>
      <div><strong id="book-count">0</strong><span>本阅读记录</span></div>
      <div><strong id="experience-count">0</strong><span>次影音游戏体验</span></div>

    <div id="collections"></div>

  <footer>
    <strong>Claire's Universe</strong>
    <span>保持好奇，继续创造。</span>
  </footer>

    <button id="close-dialog" aria-label="关闭">×</button>
